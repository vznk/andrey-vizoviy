<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Сторінку не знайдено — Andriy Vizoviy</title>
  <link rel="icon" href="/img/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;700;800&display=swap" rel="stylesheet">
  <style>
    :root { --bg: #f5f3ee; --ink: #0b1830; --muted: #6b778c; --viber: #7360f2; --accent: #0fb3cc; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font-family: "Onest", system-ui, sans-serif; text-align: center; }
    img { width: 96px; height: 96px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; box-shadow: 0 8px 24px rgba(11,24,48,.15); }
    .code { margin: 20px 0 4px; font-size: 14px; font-weight: 700; letter-spacing: .14em; color: var(--accent); }
    h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.2; }
    p { margin: 0 auto 24px; max-width: 34ch; color: var(--muted); }
    .actions { display: grid; gap: 10px; max-width: 320px; margin: 0 auto; }
    a { display: flex; align-items: center; justify-content: center; height: 52px; border-radius: 14px; font-weight: 700; text-decoration: none; }
    .primary { background: var(--viber); color: #fff; }
    .ghost { background: #fff; color: var(--ink); border: 1px solid rgba(11,24,48,.1); }
  </style>
</head>
<body>
  <main>
    <img src="/img/avatar.jpg" alt="Андрій Візовий" width="96" height="96">
    <p class="code">ПОМИЛКА 404</p>
    <h1>Такої сторінки немає</h1>
    <p>Можливо, посилання застаріло. Перейдіть на головну або одразу напишіть нам.</p>
    <div class="actions">
      <a class="primary" href="/">На головну</a>
      <a class="ghost" href="viber://chat?number=%2B380962517686">Написати у Viber</a>
    </div>
  </main>
</body>
</html>
